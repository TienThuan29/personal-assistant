# Push a tag vX.Y.Z (matching package.json's version) to build all three OSes and publish a GitHub Release.
# Pushing to main releases too: if package.json's version is already tagged, `check` bumps the patch number, commits it
# to main as github-actions[bot] (with GITHUB_TOKEN, so that commit does not re-trigger this workflow), and builds that
# commit; the Release creates the tag. Bump minor/major yourself in a normal commit.
# Run it by hand (Actions → Release → Run workflow) for a dry run: builds and uploads artifacts, publishes nothing.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the version bump to main
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun run typecheck
      - run: bun run test
      - name: Pick the release tag (bump the patch version on main if it is already tagged)
        id: ver
        run: |
          tagged() { git ls-remote --exit-code --tags origin "refs/tags/v$1" >/dev/null; }
          ver=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if tagged "$ver"; then
              while tagged "$ver"; do ver=$(echo "$ver" | awk -F. '{print $1"."$2"."$3+1}'); done
              VER=$ver node -e "const f='package.json',fs=require('fs');fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/(\"version\": \")[^\"]+/,(_,k)=>k+process.env.VER))"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -am "chore: release $ver"
              git push origin HEAD:main
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.publish == 'true'
    strategy:
      fail-fast: false # let the other OSes finish so every failure shows up in one run
      matrix:
        include:
          - { os: windows-latest, script: 'pack:win', files: 'release/PersonalAssistant-win-x64-*.exe' }
          - { os: macos-latest, script: 'pack:mac', files: 'release/*.dmg' }
          - { os: ubuntu-latest, script: 'pack:linux', files: 'release/*.AppImage' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.check.outputs.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests on macOS (the check job covers Linux; the file tools behave per OS)
        if: runner.os == 'macOS'
        run: bun run test
      - run: bun run ${{ matrix.script }}
      - name: Smoke test (starts and creates its database)
        if: runner.os == 'Linux'
        run: |
          set +e
          xvfb-run -a timeout 25 release/PersonalAssistant-linux-x64.AppImage --appimage-extract-and-run --no-sandbox --user-data-dir="$RUNNER_TEMP/pa"
          code=$?
          [ "$code" = 124 ] || { echo "exited early with code $code"; exit 1; } # 124 = still running when timeout stopped it
          test -f "$RUNNER_TEMP/pa/assistant.db"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          # upload-artifact globs have no brace expansion: .dmg is in matrix.files, .zip is listed here (macOS only matches)
          path: |
            ${{ matrix.files }}
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    if: github.event_name != 'workflow_dispatch' && needs.check.outputs.publish == 'true'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that can write to the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Every installer is present
        run: |
          for f in PersonalAssistant-win-x64-setup.exe PersonalAssistant-win-x64-portable.exe PersonalAssistant-mac-arm64.dmg PersonalAssistant-mac-x64.dmg PersonalAssistant-mac-arm64.zip PersonalAssistant-mac-x64.zip PersonalAssistant-linux-x64.AppImage latest.yml latest-mac.yml latest-linux.yml; do
            test -f "dist/$f" || { echo "missing $f"; exit 1; }
          done
      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ needs.check.outputs.tag }}" dist/* --repo "$GITHUB_REPOSITORY" --target "${{ needs.check.outputs.sha }}" --title "${{ needs.check.outputs.tag }}" --generate-notes
