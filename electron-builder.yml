# Everything is bundled by electron-vite (all deps are devDependencies), so ship only out/.
# appId is also the AppUserModelID (app.setAppUserModelId in main); the NSIS installer puts it on the
# Start-menu shortcut, which Windows needs before it shows the app's toasts (the portable exe has none).
# File names carry no version so https://github.com/<owner>/<repo>/releases/latest/download/<name> stays valid.
# Local Windows builds pass -c.electronDist (package.json "pack") to reuse the installed Electron; CI downloads it.
appId: com.personal-assistant.app
productName: Personal Assistant
directories:
  output: release
files:
  - out/**/*
  - '!**/*.map'
  - '!node_modules/**/*'
afterPack: scripts/stamp-icon.cjs
# Embeds app-update.yml and makes electron-builder write latest*.yml next to the installers: electron-updater reads them from the
# Release to self-update the Windows installer and the Linux AppImage (docs/update-design.md). Nothing is published from here (--publish never).
publish:
  provider: github
  owner: TienThuan29
  repo: personal-assistant
# Electron loads the window/tray icon through native code, which cannot read inside app.asar.
asarUnpack:
  - out/**/*.ico
win:
  target:
    - target: portable
      arch: x64
    - target: nsis
      arch: x64
  icon: assets/app-icons/personal-assistant.ico
  signAndEditExecutable: false
portable:
  artifactName: PersonalAssistant-win-x64-portable.${ext}
nsis:
  oneClick: true
  perMachine: false # per-user: %LOCALAPPDATA%\Programs, no admin prompt
  createStartMenuShortcut: true
  artifactName: PersonalAssistant-win-x64-setup.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: assets/app-icons/icon-1024.png
  category: public.app-category.productivity
  # No signing certificate: without an identity electron-builder skips signing entirely, which can leave an
  # arm64 app unable to start. Ad-hoc signing ("-") needs hardenedRuntime off (library validation).
  identity: '-'
  hardenedRuntime: false
  artifactName: PersonalAssistant-mac-${arch}.${ext}
  # Shown when macOS asks for access the first time file search walks these folders (docs/file-search-design.md).
  extendInfo:
    NSDesktopFolderUsageDescription: Personal Assistant searches and reads your files only when you turn on file search for a message.
    NSDocumentsFolderUsageDescription: Personal Assistant searches and reads your files only when you turn on file search for a message.
    NSDownloadsFolderUsageDescription: Personal Assistant searches and reads your files only when you turn on file search for a message.
linux:
  target:
    - target: AppImage
      arch: x64
  icon: assets/app-icons/icon-512.png
  category: Office
  artifactName: PersonalAssistant-linux-x64.${ext} # not ${arch}: that expands to x86_64 on Linux, and the README links x64
